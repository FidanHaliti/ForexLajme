name: Forex Lajme Scheduler

on:
  schedule:
    - cron: "0 22 * * 0-4"
      timezone: "Europe/Belgrade"
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TIMEZONE: Europe/Belgrade
      TARGET_DAYS: "1"
      RUN_NOW: "0"
      ONE_SHOT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Discord job
        run: node index.js
