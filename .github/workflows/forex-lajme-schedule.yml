name: Forex Lajme Scheduler

on:
  schedule:
    - cron: "7,22,37,52 21 * * 0"
      timezone: "Europe/Belgrade"
    - cron: "7 22 * * 0"
      timezone: "Europe/Belgrade"
    - cron: "7,22,37,52 21 * * 1-4"
      timezone: "Europe/Belgrade"
    - cron: "7 22 * * 1-4"
      timezone: "Europe/Belgrade"
  workflow_dispatch:
    inputs:
      news_mode:
        description: "Lloji i raportit (weekly = java e ardhshme)"
        type: choice
        default: daily
        options:
          - daily
          - weekly

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: forex-news-scheduler
      cancel-in-progress: false
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TIMEZONE: Europe/Belgrade
      NEWS_MODE: ${{ github.event_name == 'schedule' && (endsWith(github.event.schedule, '* * 0') && 'weekly' || 'daily') || inputs.news_mode || 'daily' }}
      SCHEDULED_RUN: ${{ github.event_name == 'schedule' && '1' || '0' }}
      RUN_NOW: "0"
      ONE_SHOT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine report and duplicate key
        id: report
        run: node schedule-context.js >> "$GITHUB_OUTPUT"

      - name: Check whether this report was already sent
        if: steps.report.outputs.send == 'true'
        id: sent
        uses: actions/cache/restore@v4
        with:
          path: .news-sent
          key: forex-news-${{ steps.report.outputs.key }}

      - name: Test reports and Discord delivery
        if: steps.report.outputs.send == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: node --test calendar.test.js discord.test.js

      - name: Run Discord job
        if: steps.report.outputs.send == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: node index.js

      - name: Mark report as sent
        if: steps.report.outputs.send == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: |
          mkdir -p .news-sent
          echo "${{ steps.report.outputs.key }}" > .news-sent/last.txt

      - name: Save sent-report marker
        if: steps.report.outputs.send == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .news-sent
          key: forex-news-${{ steps.report.outputs.key }}
