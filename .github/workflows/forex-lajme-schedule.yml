name: Forex Lajme Scheduler

on:
  schedule:
    - cron: "0 21 * * 0"
      timezone: "Europe/Belgrade"
    - cron: "0 22 * * 1-4"
      timezone: "Europe/Belgrade"
  workflow_dispatch:
    inputs:
      news_mode:
        description: "Lloji i raportit (weekly = java e ardhshme)"
        type: choice
        default: daily
        options:
          - daily
          - weekly

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TIMEZONE: Europe/Belgrade
      NEWS_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 21 * * 0' && 'weekly' || 'daily') || inputs.news_mode || 'daily' }}
      SCHEDULED_RUN: ${{ github.event_name == 'schedule' && '1' || '0' }}
      RUN_NOW: "0"
      ONE_SHOT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test reports and Discord delivery
        run: node --test calendar.test.js discord.test.js

      - name: Run Discord job
        run: node index.js
